<!DOCTYPE html>
<html>
 <head>
   <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
   <script>
    AFRAME.registerComponent('play', {
     init: function(){
       var myEl = document.querySelector('#yellow');
      this.el.addEventListener('click', function() {
       myEl.components.sound.playSound();
      });
     }
    });

    AFRAME.registerComponent('stop', {
     init: function(){
       var myEl = document.querySelector('#yellow');
      this.el.addEventListener('click', function(){
       myEl.components.sound.stopSound();
      });
     }
    });
   </script>
  
 </head>

 <body>
    <a-scene>

        <assets>
    <video id="sample-video" autoplay loop="true" src="fire.mp4"></video>
    <audio id="water" src="video/water-waves.mp4"></audio>
   </assets>
     
      <a-plane width="45" height="35" position="0 -2 -10" color="#AAAAAA" rotation="-90 0 0"></a-plane>
      <a-plane width="10" height="15" position="0 -10 -10" 
      color="#BBBBBB" rotation="0 0 0"></a-plane>

      <a-box position="0 2 -2.5" rotation="45 45 45"></a-box> 
     <a-light color="blue" position="0 5 -3"></a-light>
     <a-light color="red" position="0 5 -1" type="ambient" intensity="0.3"></a-light>

    <a-cylinder color="purple" height="5" position="2 0 -5" sound= "src: #water;
     on: click; 
     volume:1; 
     refDistance:4; 
     rolloffFactor:4">
      <a-entity sound = "src: #water; autoplay: true"></a-entity>
     </a-cylinder>


     <a-box id="yellow" color="yellow" position="1.5 0.5 -2.5" sound="src: #water">
     <a-sphere color="green" radius="0.25" position="-0.5 1 0" play></a-sphere>
      <a-sphere color="red" radius="0.25" position="0.5 1 0" stop></a-sphere>
     </a-box>
     
    <a-video src="#sample-video" width="16" height="9" position="0 0 -15"></a-video>
    </a-scene>
 </body> 
</html>
